# Fly.io: one machine running the Docker image, with a volume for the database and media.
# First time: see docs/deploying.md.
app = "the-enemy-within"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[mounts]
  source = "tew_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # One always-on machine: SQLite lives on its volume, and players poll during sessions.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
